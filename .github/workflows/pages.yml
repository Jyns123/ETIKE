# Publica en GitHub Pages el informe (docs/, Jekyll) y, en /demo/, la version
# estatica del panel (web/frontend, npm run build:demo: sin backend, con las
# respuestas exportadas por web/backend/scripts/export_demo.py).
#
# En un PR solo compila (sirve de chequeo); se despliega al hacer push a main.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Compilar la demo estatica
        working-directory: web/frontend
        run: |
          npm ci
          npm run build:demo

      # antes de Jekyll: asi la demo entra al sitio como archivos estaticos
      - name: Copiar la demo dentro del sitio
        run: cp -r web/frontend/dist-demo docs/demo

      - name: Compilar el informe (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
